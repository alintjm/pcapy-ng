name: Build Windows Wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.0

      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          pip install build setuptools wheel

      - name: Download Npcap SDK
        run: |
          curl -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          tar -xf npcap-sdk.zip
          ren npcap-sdk-1.13 npcap-sdk

      - name: Patch setup.py
        run: |
          (Get-Content setup.py) `
          -replace "c:\\\\wpdpack\\\\Include", "$env:GITHUB_WORKSPACE\\npcap-sdk\\Include" `
          -replace "c:\\\\wpdpack\\\\Lib", "$env:GITHUB_WORKSPACE\\npcap-sdk\\Lib\\x64" `
          | Set-Content setup.py

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          
