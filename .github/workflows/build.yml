name: Build Windows Wheel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.0

      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          pip install build setuptools wheel

      - name: Download Npcap SDK
        run: |
          curl -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath npcap-sdk
        # tar -xf npcap-sdk.zip
        # This extracts to folder "npcap-sdk", NOT "npcap-sdk-1.13"

      - name: Show extracted files
        run: |
          Write-Host "Contents of workspace:"
          Get-ChildItem -Recurse -Depth 2
          
      - name: Create fake wpdpack directory
        run: |
          mkdir C:\wpdpack
          mkdir C:\wpdpack\Include
          mkdir C:\wpdpack\Lib
          mkdir C:\wpdpack\Lib\x64

          Copy-Item -Recurse -Force "npcap-sdk\Include\*" C:\wpdpack\Include\
          Copy-Item -Recurse -Force "npcap-sdk\Lib\x64\*" C:\wpdpack\Lib\x64\
        # Copy-Item -Recurse -Force npcap-sdk\Include\* C:\wpdpack\Include\
        # Copy-Item -Recurse -Force npcap-sdk\Lib\x64\* C:\wpdpack\Lib\x64\

        # $folder = Get-ChildItem -Directory | Where-Object { $_.Name -like "npcap*" } | Select-Object -First 1
        # Write-Host "Detected Npcap folder: $($folder.FullName)"
        
        # Copy-Item -Recurse -Force "$($folder.FullName)\Include\*" C:\wpdpack\Include\
        # Copy-Item -Recurse -Force "$($folder.FullName)\Lib\x64\*" C:\wpdpack\Lib\x64\

          
      # - name: Patch setup.py
      #  run: |
      #    (Get-Content setup.py) `
      #   -replace "c:\\\\wpdpack\\\\Include", "$env:GITHUB_WORKSPACE\\npcap-sdk\\Include" `
      #    -replace "c:\\\\wpdpack\\\\Lib", "$env:GITHUB_WORKSPACE\\npcap-sdk\\Lib\\x64" `
      #    | Set-Content setup.py

      - name: Build wheel
        run: |
          python -m build --wheel

      #- name: Upload wheel
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: wheel
      #    path: dist/*.whl

      #- name: Create Release and upload wheel
      #  uses: softprops/action-gh-release@v2
      #  with:
      #    tag_name: build-${{ github.run_number }}
      #    name: Wheel Build ${{ github.run_number }}
      #    #tag_name: wheel-build
      #    #name: Wheel Build
      #    files: dist/*.whl
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload wheel to wheels branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          REM create or switch to 'wheels' branch locally
          git checkout -B wheels

          REM make wheels directory and copy files
          mkdir -p wheels
          cp dist/*.whl wheels/

          git add wheels/*.whl
          git commit -m "Wheel build ${{ github.run_number }}" || echo "No changes to commit"
          
          git push origin wheels --force
